name: Music Vault Playback Builder

on:
  workflow_dispatch:

  # Metadata Scanner সফলভাবে শেষ হলে
  # Playback Builder অটো চালু হবে
  workflow_run:
    workflows:
      - Music Vault Metadata Scanner
    types:
      - completed

permissions:
  contents: write

jobs:
  build-playback:

    # workflow_run হলে শুধু সফল scanner-এর পর চলবে
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Install FFmpeg
      # ==========================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ==========================================
      # 3. Install Python packages
      # ==========================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2


      # ==========================================
      # 4. Smart Audio Builder
      # ==========================================

      - name: Build smart audio playback
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          python - <<'PY'

          import json
          import os
          import subprocess
          import tempfile

          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload


          # ==========================================
          # Configuration
          # ==========================================

          REPO_BASE = "https://gcprokash.github.io/music-vault"

          AUDIO_DIR = Path("audio")
          AUDIO_DIR.mkdir(parents=True, exist_ok=True)


          # ==========================================
          # Browser-compatible codec priority
          # ==========================================

          CODEC_PRIORITY = [
              "opus",
              "flac",
              "aac",
              "mp3",
              "vorbis"
          ]


          EXTENSIONS = {
              "opus": "opus",
              "flac": "flac",
              "aac": "aac",
              "mp3": "mp3",
              "vorbis": "ogg"
          }


          # ==========================================
          # Load media.json
          # ==========================================

          with open(
              "media.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          files = data.get("files", [])


          print("========================================")
          print(" MUSIC VAULT SMART AUDIO BUILDER")
          print("========================================")
          print("Total files:", len(files))
          print()


          # ==========================================
          # Google Drive authentication
          # ==========================================

          credentials_info = json.loads(
              os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          )

          credentials = (
              service_account
              .Credentials
              .from_service_account_info(
                  credentials_info,
                  scopes=[
                      "https://www.googleapis.com/auth/drive.readonly"
                  ]
              )
          )


          drive = build(
              "drive",
              "v3",
              credentials=credentials
          )


          changed = False


          # ==========================================
          # Process every media file
          # ==========================================

          for item in files:

              file_id = item.get("id")

              title = (
                  item.get("title")
                  or item.get("fileName")
                  or "Unknown"
              )


              if not file_id:

                  print(
                      "SKIP:",
                      title,
                      "- missing file ID"
                  )

                  continue


              print()
              print("========================================")
              print("Processing:", title)
              print("Drive ID:", file_id)
              print("========================================")


              # ======================================
              # Temporary source file
              # ======================================

              with tempfile.TemporaryDirectory() as temp:

                  temp = Path(temp)

                  source = temp / "source.mkv"


                  # ==================================
                  # Download original file
                  # ==================================

                  print("Downloading original MKV...")


                  request = drive.files().get(
                      fileId=file_id,
                      alt="media"
                  )


                  with open(
                      source,
                      "wb"
                  ) as fh:

                      downloader = MediaIoBaseDownload(
                          fh,
                          request,
                          chunksize=10 * 1024 * 1024
                      )


                      done = False


                      while not done:

                          status, done = (
                              downloader.next_chunk()
                          )


                          if status:

                              print(
                                  f"Download: "
                                  f"{status.progress() * 100:.1f}%"
                              )


                  print("Download complete.")


                  # ==================================
                  # Probe ALL audio streams
                  # ==================================

                  probe_cmd = [
                      "ffprobe",
                      "-v",
                      "error",

                      "-select_streams",
                      "a",

                      "-show_entries",
                      (
                          "stream="
                          "index,"
                          "codec_name,"
                          "channels,"
                          "sample_rate,"
                          "bits_per_sample,"
                          "channel_layout:"
                          "stream_tags="
                          "language,"
                          "title,"
                          "handler_name:"
                          "stream_disposition="
                          "default"
                      ),

                      "-of",
                      "json",

                      str(source)
                  ]


                  result = subprocess.run(
                      probe_cmd,
                      capture_output=True,
                      text=True
                  )


                  # ==================================
                  # ffprobe error handling
                  # ==================================

                  if result.returncode != 0:

                      print()
                      print("FFPROBE ERROR")
                      print(result.stderr)

                      item["audioPlaybackAvailable"] = False
                      item["audioPlaybackReason"] = (
                          "Unable to inspect audio tracks"
                      )

                      changed = True

                      continue


                  try:

                      probe = json.loads(
                          result.stdout
                      )

                  except json.JSONDecodeError:

                      print(
                          "Invalid ffprobe JSON."
                      )

                      item["audioPlaybackAvailable"] = False
                      item["audioPlaybackReason"] = (
                          "Invalid audio metadata"
                      )

                      changed = True

                      continue


                  streams = probe.get(
                      "streams",
                      []
                  )


                  print()
                  print(
                      "Audio tracks found:",
                      len(streams)
                  )


                  # ==================================
                  # Display tracks
                  # ==================================

                  for stream in streams:

                      print(
                          "Track",
                          stream.get("index"),
                          "|",
                          stream.get("codec_name"),
                          "|",
                          stream.get("channels"),
                          "ch |",
                          stream.get("sample_rate"),
                          "Hz"
                      )


                  # ==================================
                  # Smart codec selection
                  # ==================================

                  selected = None


                  for codec in CODEC_PRIORITY:

                      for stream in streams:

                          if (
                              stream.get("codec_name")
                              == codec
                          ):

                              selected = stream

                              break


                      if selected:

                          break


                  # ==================================
                  # No browser-compatible track
                  # ==================================

                  if not selected:

                      print()
                      print(
                          "NO BROWSER-COMPATIBLE "
                          "ORIGINAL AUDIO"
                      )


                      codecs = [
                          s.get("codec_name")
                          for s in streams
                      ]


                      item[
                          "audioPlaybackAvailable"
                      ] = False


                      item[
                          "audioPlaybackReason"
                      ] = (
                          "No supported original "
                          "audio codec"
                      )


                      item[
                          "audioTracksDetected"
                      ] = codecs


                      changed = True

                      continue


                  # ==================================
                  # Selected track
                  # ==================================

                  codec = selected.get(
                      "codec_name"
                  )

                  stream_index = selected.get(
                      "index"
                  )


                  extension = EXTENSIONS[
                      codec
                  ]


                  output_file = (
                      AUDIO_DIR
                      / f"{file_id}.{extension}"
                  )


                  playback_url = (
                      f"{REPO_BASE}/audio/"
                      f"{file_id}.{extension}"
                  )


                  print()
                  print(
                      "SELECTED AUDIO:",
                      codec.upper()
                  )

                  print(
                      "Stream:",
                      stream_index
                  )

                  print(
                      "Output:",
                      output_file
                  )


                  # ==================================
                  # Extract without re-encoding
                  # ==================================

                  ffmpeg_cmd = [

                      "ffmpeg",

                      "-hide_banner",
                      "-loglevel",
                      "error",

                      "-i",
                      str(source),

                      "-map",
                      f"0:{stream_index}",

                      "-vn",

                      "-c:a",
                      "copy",

                      "-map_metadata",
                      "0",

                      "-y",

                      str(output_file)
                  ]


                  extract = subprocess.run(
                      ffmpeg_cmd,
                      capture_output=True,
                      text=True
                  )


                  if extract.returncode != 0:

                      print()
                      print(
                          "AUDIO EXTRACTION ERROR"
                      )

                      print(
                          extract.stderr
                      )

                      item[
                          "audioPlaybackAvailable"
                      ] = False

                      item[
                          "audioPlaybackReason"
                      ] = (
                          "Audio extraction failed"
                      )

                      changed = True

                      continue


                  # ==================================
                  # Verify output
                  # ==================================

                  if (
                      not output_file.exists()
                      or
                      output_file.stat().st_size == 0
                  ):

                      print(
                          "Output audio file is empty."
                      )

                      item[
                          "audioPlaybackAvailable"
                      ] = False

                      item[
                          "audioPlaybackReason"
                      ] = (
                          "Empty extracted audio"
                      )

                      changed = True

                      continue


                  size_mb = (
                      output_file.stat().st_size
                      / (1024 * 1024)
                  )


                  print()
                  print(
                      f"Audio created: "
                      f"{size_mb:.2f} MB"
                  )


                  # ==================================
                  # Save playback metadata
                  # ==================================

                  item[
                      "audioPlaybackAvailable"
                  ] = True


                  item[
                      "audioPlaybackCodec"
                  ] = codec


                  item[
                      "audioPlaybackStream"
                  ] = stream_index


                  item[
                      "audioPlaybackUrl"
                  ] = playback_url


                  item[
                      "audioPlaybackFile"
                  ] = (
                      f"audio/"
                      f"{file_id}.{extension}"
                  )


                  changed = True


                  print(
                      "Playback URL:",
                      playback_url
                  )


          # ==========================================
          # Save media.json
          # ==========================================

          if changed:

              with open(
                  "media.json",
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

                  f.write("\n")


              print()
              print(
                  "media.json updated."
              )

          else:

              print()
              print(
                  "No metadata changes."
              )


          print()
          print("========================================")
          print(" SMART AUDIO BUILD COMPLETE")
          print("========================================")

          PY


      # ==========================================
      # 5. Show generated files
      # ==========================================

      - name: Check generated audio
        run: |

          echo "========================================"
          echo " GENERATED AUDIO FILES"
          echo "========================================"

          find audio \
            -type f \
            \( \
              -name "*.opus" \
              -o -name "*.flac" \
              -o -name "*.aac" \
              -o -name "*.mp3" \
              -o -name "*.ogg" \
            \) \
            -printf "%f - %s bytes\n" \
            || true


      # ==========================================
      # 6. Commit
      # ==========================================

      - name: Commit audio and metadata
        run: |

          git config user.name "Music Vault Bot"

          git config user.email \
            "music-vault-bot@users.noreply.github.com"

          git add audio media.json

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Build Music Vault smart audio playback"

            git push

          fi
