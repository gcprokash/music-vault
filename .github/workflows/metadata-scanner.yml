name: Music Vault Metadata Scanner

on:
  workflow_dispatch:

  schedule:
    # প্রতি ৫ মিনিটে অটো রান
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================================
      # INSTALL FFMPEG
      # =====================================================

      - name: Install FFmpeg / FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      - name: Check FFprobe
        run: |
          ffprobe -version


      # =====================================================
      # INSTALL PYTHON PACKAGES
      # =====================================================

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2


      # =====================================================
      # CREATE SCANNER
      # =====================================================

      - name: Create Scanner
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          cat > scanner.py <<'PYTHON'

          import os
          import json
          import re
          import subprocess
          import shutil
          import html
          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload


          # =================================================
          # CONFIGURATION
          # =================================================

          VIDEO_FOLDER_ID = "1lu8rV1ctx4nAJ1pRKJguJJS5bUpKGXql"

          SPREADSHEET_ID = "13t2hCpG87CGhOuSdd2yX-6yLnSfufTCR4Jrca_dvg-0"

          OUTPUT_JSON = Path("media.json")

          COVERS_DIR = Path("covers")

          TEMP_DIR = Path("scanner_temp")


          MEDIA_EXTENSIONS = {
              ".mkv",
              ".mp4",
              ".webm",
              ".avi",
              ".mov",
              ".m4v"
          }


          IMAGE_EXTENSIONS = {
              ".jpg",
              ".jpeg",
              ".png",
              ".webp"
          }


          # =================================================
          # SHEET HEADERS
          # =================================================

          SHEET_HEADERS = {

              "Media": [
                  "Media_ID",
                  "Title",
                  "File_Name",
                  "Artist",
                  "Album",
                  "Composer",
                  "Resolution",
                  "Video_Codec",
                  "Video_Quality",
                  "Audio_Count",
                  "Hi_Res_Audio",
                  "Subtitle_Count",
                  "Cover",
                  "Cover_Source",
                  "Drive_URL",
                  "Download_URL"
              ],

              "Files": [
                  "File_ID",
                  "Media_ID",
                  "File_Name",
                  "File_Type",
                  "File_Size",
                  "Modified_Time",
                  "Drive_URL",
                  "Download_URL"
              ],

              "Video": [
                  "Video_ID",
                  "Media_ID",
                  "File_Name",
                  "Codec",
                  "Profile",
                  "Width",
                  "Height",
                  "Resolution",
                  "Aspect_Ratio",
                  "FPS",
                  "Bitrate",
                  "Bit_Depth",
                  "Pixel_Format",
                  "HDR",
                  "Scan_Type",
                  "Default"
              ],

              "Audio": [
                  "Audio_ID",
                  "Media_ID",
                  "Track_No",
                  "Title",
                  "Codec",
                  "Sample_Rate",
                  "Bit_Depth",
                  "Channels",
                  "Channel_Layout",
                  "Language",
                  "Hi_Res",
                  "Default"
              ],

              "Subtitle": [
                  "Subtitle_ID",
                  "Media_ID",
                  "Track_No",
                  "Codec",
                  "Language",
                  "Title",
                  "Default",
                  "Forced"
              ],

              "Covers": [
                  "Cover_ID",
                  "Media_ID",
                  "File_Name",
                  "Cover_Source",
                  "Cover_URL",
                  "Drive_URL"
              ]

          }


          # =================================================
          # DIRECTORIES
          # =================================================

          COVERS_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          TEMP_DIR.mkdir(
              parents=True,
              exist_ok=True
          )


          # =================================================
          # GOOGLE AUTH
          # =================================================

          service_account_json = os.environ.get(
              "GOOGLE_SERVICE_ACCOUNT_JSON"
          )

          if not service_account_json:

              raise RuntimeError(
                  "GOOGLE_SERVICE_ACCOUNT_JSON secret is missing."
              )


          credentials = (
              service_account.Credentials
              .from_service_account_info(
                  json.loads(
                      service_account_json
                  ),
                  scopes=[
                      "https://www.googleapis.com/auth/drive.readonly",
                      "https://www.googleapis.com/auth/spreadsheets"
                  ]
              )
          )


          drive = build(
              "drive",
              "v3",
              credentials=credentials
          )


          sheets = build(
              "sheets",
              "v4",
              credentials=credentials
          )


          # =================================================
          # NORMALIZE TEXT
          # =================================================

          def normalize_text(value):

              value = str(value or "")

              value = value.lower()

              value = re.sub(
                  r"\.[a-z0-9]{2,5}$",
                  "",
                  value
              )

              value = re.sub(
                  r"\[[^\]]*\]",
                  "",
                  value
              )

              value = re.sub(
                  r"\([^)]*\)",
                  "",
                  value
              )

              value = re.sub(
                  r"[_\-]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"[^a-z0-9\u0980-\u09ff]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          # =================================================
          # CLEAN TITLE
          # =================================================

          def clean_title(filename):

              name = Path(filename).stem

              name = re.sub(
                  r"\s*\[[^\]]*\].*$",
                  "",
                  name
              )

              name = re.sub(
                  r"\s+(2160p|1440p|1080p|720p|4k|2k)\b",
                  "",
                  name,
                  flags=re.I
              )

              return name.strip()


          # =================================================
          # FFPROBE
          # =================================================

          def run_ffprobe(path):

              command = [
                  "ffprobe",
                  "-v",
                  "quiet",
                  "-print_format",
                  "json",
                  "-show_format",
                  "-show_streams",
                  str(path)
              ]

              result = subprocess.run(
                  command,
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:

                  raise RuntimeError(
                      result.stderr
                  )

              return json.loads(
                  result.stdout
              )


          # =================================================
          # DRIVE DOWNLOAD
          # =================================================

          def download_drive_file(
              file_id,
              destination
          ):

              request = (
                  drive.files()
                  .get_media(
                      fileId=file_id
                  )
              )

              with open(
                  destination,
                  "wb"
              ) as fh:

                  downloader = (
                      MediaIoBaseDownload(
                          fh,
                          request
                      )
                  )

                  done = False

                  while not done:

                      status, done = (
                          downloader.next_chunk()
                      )


          # =================================================
          # LIST DRIVE CHILDREN
          # =================================================

          def list_drive_children(
              folder_id
          ):

              files = []

              page_token = None

              while True:

                  response = (
                      drive.files()
                      .list(
                          q=(
                              f"'{folder_id}' in parents "
                              "and trashed = false"
                          ),
                          fields=(
                              "nextPageToken,"
                              "files("
                              "id,"
                              "name,"
                              "mimeType,"
                              "size,"
                              "modifiedTime"
                              ")"
                          ),
                          pageSize=1000,
                          pageToken=page_token
                      )
                      .execute()
                  )

                  files.extend(
                      response.get(
                          "files",
                          []
                      )
                  )

                  page_token = (
                      response.get(
                          "nextPageToken"
                      )
                  )

                  if not page_token:
                      break

              return files


          # =================================================
          # FIND COVER FOLDER
          # =================================================

          def find_cover_folder():

              children = list_drive_children(
                  VIDEO_FOLDER_ID
              )

              # Cover folder is normally beside Video File,
              # so we look in the parent folder separately.

              response = (
                  drive.files()
                  .get(
                      fileId=VIDEO_FOLDER_ID,
                      fields="parents"
                  )
                  .execute()
              )

              parents = response.get(
                  "parents",
                  []
              )

              if not parents:
                  return None

              parent_id = parents[0]

              children = list_drive_children(
                  parent_id
              )

              for item in children:

                  if (
                      item.get("mimeType")
                      ==
                      "application/vnd.google-apps.folder"
                      and
                      item.get(
                          "name",
                          ""
                      ).lower()
                      ==
                      "cover"
                  ):

                      return item

              return None


          # =================================================
          # LOAD CUSTOM COVERS
          # =================================================

          def load_custom_covers(
              cover_folder_id
          ):

              if not cover_folder_id:
                  return []

              children = list_drive_children(
                  cover_folder_id
              )

              covers = []

              for item in children:

                  name = item.get(
                      "name",
                      ""
                  )

                  ext = Path(
                      name
                  ).suffix.lower()

                  if ext in IMAGE_EXTENSIONS:

                      covers.append(
                          item
                      )

              return covers


          # =================================================
          # FIND MATCHING COVER
          # =================================================

          def find_matching_cover(
              media_filename,
              media_title,
              custom_covers
          ):

              targets = [

                  normalize_text(
                      media_filename
                  ),

                  normalize_text(
                      media_title
                  )

              ]

              targets = [
                  x
                  for x in targets
                  if x
              ]


              # -------------------------------------------------
              # EXACT
              # -------------------------------------------------

              for cover in custom_covers:

                  cover_name = normalize_text(
                      cover.get(
                          "name",
                          ""
                      )
                  )

                  for target in targets:

                      if cover_name == target:

                          return cover


              # -------------------------------------------------
              # PARTIAL
              # -------------------------------------------------

              for cover in custom_covers:

                  cover_name = normalize_text(
                      cover.get(
                          "name",
                          ""
                      )
                  )

                  for target in targets:

                      if (
                          cover_name.startswith(
                              target
                          )
                          or
                          target.startswith(
                              cover_name
                          )
                      ):

                          return cover


              return None


          # =================================================
          # EMBEDDED COVER
          # =================================================

          def extract_embedded_cover(
              media_path,
              output_path
          ):

              command = [

                  "ffmpeg",

                  "-y",

                  "-i",
                  str(media_path),

                  "-map",
                  "0:v:m:attached_pic",

                  "-frames:v",
                  "1",

                  str(output_path)

              ]

              result = subprocess.run(
                  command,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              return (
                  result.returncode == 0
                  and output_path.exists()
                  and output_path.stat().st_size > 0
              )


          # =================================================
          # GENERATED FALLBACK COVER
          # =================================================

          def generate_fallback_cover(
              title,
              artist,
              output_path
          ):

              display_title = str(
                  title or "Music"
              )

              display_artist = str(
                  artist or "Music Vault"
              )


              display_title = re.sub(
                  r"\s*\[[^\]]*\]",
                  "",
                  display_title
              )

              display_title = re.sub(
                  r"\s*\([^)]*\)",
                  "",
                  display_title
              )

              display_title = re.sub(
                  r"\s+(2160p|1440p|1080p|720p|4k|2k)\b",
                  "",
                  display_title,
                  flags=re.I
              )

              display_title = re.sub(
                  r"\s+",
                  " ",
                  display_title
              ).strip()


              if not display_title:
                  display_title = "Music"


              safe_artist = html.escape(
                  display_artist
              )


              words = display_title.split()

              title_lines = []

              current_line = ""

              MAX_CHARS = 22


              for word in words:

                  test_line = (
                      word
                      if not current_line
                      else current_line + " " + word
                  )

                  if len(test_line) <= MAX_CHARS:

                      current_line = test_line

                  else:

                      if current_line:
                          title_lines.append(
                              current_line
                          )

                      current_line = word


              if current_line:
                  title_lines.append(
                      current_line
                  )


              title_lines = title_lines[:3]


              title_svg = ""

              start_y = 690

              line_gap = 58


              for index, line in enumerate(
                  title_lines
              ):

                  safe_line = html.escape(
                      line
                  )

                  y = (
                      start_y
                      +
                      index * line_gap
                  )

                  title_svg += f'''
          <text
              x="500"
              y="{y}"
              text-anchor="middle"
              fill="#ffffff"
              font-size="46"
              font-family="Arial, sans-serif"
              font-weight="700">
              {safe_line}
          </text>
          '''


              svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          width="1000"
          height="1000"
          viewBox="0 0 1000 1000">

          <defs>

              <linearGradient
                  id="bg"
                  x1="0"
                  y1="0"
                  x2="1"
                  y2="1">

                  <stop
                      offset="0%"
                      stop-color="#12082d"/>

                  <stop
                      offset="45%"
                      stop-color="#4c1d95"/>

                  <stop
                      offset="100%"
                      stop-color="#160b35"/>

              </linearGradient>


              <radialGradient id="glow">

                  <stop
                      offset="0%"
                      stop-color="#a855f7"
                      stop-opacity="0.95"/>

                  <stop
                      offset="45%"
                      stop-color="#7c3aed"
                      stop-opacity="0.45"/>

                  <stop
                      offset="100%"
                      stop-color="#7c3aed"
                      stop-opacity="0"/>

              </radialGradient>


              <radialGradient id="glow2">

                  <stop
                      offset="0%"
                      stop-color="#6366f1"
                      stop-opacity="0.65"/>

                  <stop
                      offset="100%"
                      stop-color="#6366f1"
                      stop-opacity="0"/>

              </radialGradient>


              <linearGradient
                  id="ring"
                  x1="0"
                  y1="0"
                  x2="1"
                  y2="1">

                  <stop
                      offset="0%"
                      stop-color="#ffffff"
                      stop-opacity="0.30"/>

                  <stop
                      offset="100%"
                      stop-color="#ffffff"
                      stop-opacity="0.05"/>

              </linearGradient>

          </defs>


          <rect
              width="1000"
              height="1000"
              fill="url(#bg)"/>


          <circle
              cx="210"
              cy="170"
              r="280"
              fill="url(#glow2)"/>


          <circle
              cx="790"
              cy="760"
              r="330"
              fill="url(#glow)"/>


          <circle
              cx="500"
              cy="380"
              r="360"
              fill="url(#glow)"/>


          <circle
              cx="500"
              cy="380"
              r="220"
              fill="none"
              stroke="url(#ring)"
              stroke-width="3"/>


          <circle
              cx="500"
              cy="380"
              r="170"
              fill="none"
              stroke="#ffffff"
              stroke-opacity="0.14"
              stroke-width="2"/>


          <circle
              cx="500"
              cy="380"
              r="125"
              fill="none"
              stroke="#ffffff"
              stroke-opacity="0.18"
              stroke-width="2"/>


          <circle
              cx="500"
              cy="380"
              r="82"
              fill="#ffffff"
              fill-opacity="0.06"
              stroke="#ffffff"
              stroke-opacity="0.22"
              stroke-width="2"/>


          <text
              x="500"
              y="415"
              text-anchor="middle"
              fill="#ffffff"
              font-size="105"
              font-family="Arial, sans-serif"
              font-weight="700">
              ♪
          </text>


          <text
              x="500"
              y="560"
              text-anchor="middle"
              fill="#ddd6fe"
              font-size="22"
              font-family="Arial, sans-serif"
              font-weight="600"
              letter-spacing="7">
              MUSIC RELEASE
          </text>


          {title_svg}


          <text
              x="500"
              y="875"
              text-anchor="middle"
              fill="#ddd6fe"
              font-size="28"
              font-family="Arial, sans-serif">
              {safe_artist}
          </text>


          <text
              x="500"
              y="935"
              text-anchor="middle"
              fill="#ffffff"
              fill-opacity="0.42"
              font-size="20"
              font-family="Arial, sans-serif"
