              letter-spacing="6">
              MUSIC VAULT
          </text>


          </svg>'''


              output_path.write_text(
                  svg,
                  encoding="utf-8"
              )


          # =================================================
          # VIDEO QUALITY
          # =================================================

          def video_quality(
              width,
              height
          ):

              if width >= 3800 or height >= 2100:
                  return "4K"

              if width >= 2500 or height >= 1300:
                  return "2K"

              if width >= 1900 or height >= 1000:
                  return "1080p"

              if width >= 1200 or height >= 700:
                  return "720p"

              return f"{width}x{height}"


          # =================================================
          # FPS
          # =================================================

          def parse_fps(value):

              if not value:
                  return ""

              try:

                  if "/" in str(value):

                      a, b = str(value).split(
                          "/",
                          1
                      )

                      return round(
                          float(a) / float(b),
                          3
                      )

                  return float(value)

              except Exception:

                  return ""


          # =================================================
          # AUDIO SCANNER
          # =================================================

          def scan_audio(
              streams
          ):

              audio_streams = [

                  stream

                  for stream in streams

                  if stream.get(
                      "codec_type"
                  )
                  ==
                  "audio"

              ]


              tracks = []

              hi_res_count = 0

              hi_res_index = None


              for track_no, stream in enumerate(
                  audio_streams,
                  start=1
              ):

                  tags = stream.get(
                      "tags",
                      {}
                  )

                  disposition = stream.get(
                      "disposition",
                      {}
                  )


                  codec = (
                      stream.get(
                          "codec_name"
                      )
                      or ""
                  ).lower()


                  try:

                      sample_rate = int(
                          stream.get(
                              "sample_rate",
                              0
                          )
                          or 0
                      )

                  except Exception:

                      sample_rate = 0


                  try:

                      bits = int(
                          stream.get(
                              "bits_per_raw_sample",
                              0
                          )
                          or 0
                      )

                  except Exception:

                      bits = 0


                  title = tags.get(
                      "title",
                      ""
                  )

                  language = tags.get(
                      "language",
                      ""
                  )


                  is_hires = (

                      codec in {
                          "alac",
                          "flac",
                          "wavpack",
                          "ape",
                          "pcm_s24le",
                          "pcm_s32le",
                          "pcm_f32le",
                          "pcm_f64le"
                      }

                      or
                      "hi-res" in title.lower()

                      or
                      "hires" in title.lower()

                      or
                      sample_rate >= 96000

                      or
                      bits >= 24

                  )


                  if is_hires:

                      hi_res_count += 1

                      if hi_res_index is None:
                          hi_res_index = track_no


                  tracks.append({

                      "trackNo":
                          track_no,

                      "title":
                          title,

                      "codec":
                          codec,

                      "sampleRate":
                          sample_rate,

                      "bitDepth":
                          bits,

                      "channels":
                          stream.get(
                              "channels",
                              ""
                          ),

                      "channelLayout":
                          stream.get(
                              "channel_layout",
                              ""
                          ),

                      "language":
                          language,

                      "hiRes":
                          is_hires,

                      "default":
                          bool(
                              disposition.get(
                                  "default",
                                  0
                              )
                          )

                  })


              return {

                  "trackCount":
                      len(tracks),

                  "hiResCount":
                      hi_res_count,

                  "hiResTrack":
                      hi_res_index,

                  "tracks":
                      tracks

              }


          # =================================================
          # VIDEO SCANNER
          # =================================================

          def scan_video(
              streams
          ):

              video_streams = [

                  stream

                  for stream in streams

                  if (
                      stream.get(
                          "codec_type"
                      )
                      ==
                      "video"
                  )
                  and
                  not (
                      stream.get(
                          "disposition",
                          {}
                      ).get(
                          "attached_pic",
                          0
                      )
                  )

              ]


              if not video_streams:
                  return None


              stream = video_streams[0]


              width = int(
                  stream.get(
                      "width",
                      0
                  )
                  or 0
              )


              height = int(
                  stream.get(
                      "height",
                      0
                  )
                  or 0
              )


              tags = stream.get(
                  "tags",
                  {}
              )


              disposition = stream.get(
                  "disposition",
                  {}
              )


              color_transfer = (
                  stream.get(
                      "color_transfer"
                  )
                  or ""
              )


              color_primaries = (
                  stream.get(
                      "color_primaries"
                  )
                  or ""
              )


              hdr = ""


              if (
                  color_transfer
                  in {
                      "smpte2084",
                      "arib-std-b67"
                  }
              ):

                  hdr = "HDR"


              elif (
                  "hdr" in str(
                      tags
                  ).lower()
              ):

                  hdr = "HDR"


              return {

                  "codec":
                      stream.get(
                          "codec_name",
                          ""
                      ),

                  "profile":
                      stream.get(
                          "profile",
                          ""
                      ),

                  "width":
                      width,

                  "height":
                      height,

                  "resolution":
                      f"{width}x{height}",

                  "quality":
                      video_quality(
                          width,
                          height
                      ),

                  "aspectRatio":
                      stream.get(
                          "display_aspect_ratio",
                          ""
                      ),

                  "fps":
                      parse_fps(
                          stream.get(
                              "avg_frame_rate"
                          )
                      ),

                  "bitrate":
                      stream.get(
                          "bit_rate",
                          ""
                      ),

                  "bitDepth":
                      stream.get(
                          "bits_per_raw_sample",
                          ""
                      ),

                  "pixelFormat":
                      stream.get(
                          "pix_fmt",
                          ""
                      ),

                  "hdr":
                      hdr,

                  "scanType":
                      stream.get(
                          "field_order",
                          ""
                      ),

                  "default":
                      bool(
                          disposition.get(
                              "default",
                              0
                          )
                      )

              }


          # =================================================
          # SUBTITLE SCANNER
          # =================================================

          def scan_subtitles(
              streams
          ):

              subtitles = []


              subtitle_streams = [

                  stream

                  for stream in streams

                  if stream.get(
                      "codec_type"
                  )
                  ==
                  "subtitle"

              ]


              for track_no, stream in enumerate(
                  subtitle_streams,
                  start=1
              ):

                  tags = stream.get(
                      "tags",
                      {}
                  )

                  disposition = stream.get(
                      "disposition",
                      {}
                  )


                  subtitles.append({

                      "trackNo":
                          track_no,

                      "codec":
                          stream.get(
                              "codec_name",
                              ""
                          ),

                      "language":
                          tags.get(
                              "language",
                              ""
                          ),

                      "title":
                          tags.get(
                              "title",
                              ""
                          ),

                      "default":
                          bool(
                              disposition.get(
                                  "default",
                                  0
                              )
                          ),

                      "forced":
                          bool(
                              disposition.get(
                                  "forced",
                                  0
                              )
                          )

                  })


              return subtitles


          # =================================================
          # METADATA
          # =================================================

          def get_metadata(
              probe,
              filename
          ):

              format_data = probe.get(
                  "format",
                  {}
              )


              tags = format_data.get(
                  "tags",
                  {}
              )


              title = (

                  tags.get(
                      "title"
                  )

                  or

                  clean_title(
                      filename
                  )

              )


              artist = (

                  tags.get(
                      "artist"
                  )

                  or

                  tags.get(
                      "album_artist"
                  )

                  or
                  ""

              )


              album = (
                  tags.get(
                      "album"
                  )
                  or
                  ""
              )


              composer = (
                  tags.get(
                      "composer"
                  )
                  or
                  ""
              )


              return {

                  "title":
                      str(title).strip(),

                  "artist":
                      str(artist).strip(),

                  "album":
                      str(album).strip(),

                  "composer":
                      str(composer).strip()

              }


          # =================================================
          # DRIVE COVER URL
          # =================================================

          def drive_view_url(
              file_id
          ):

              return (
                  "https://drive.google.com/file/d/"
                  +
                  file_id
                  +
                  "/view"
              )


          def drive_download_url(
              file_id
          ):

              return (
                  "https://drive.google.com/uc?"
                  "export=download&id="
                  +
                  file_id
              )


          # =================================================
          # GOOGLE SHEET HELPERS
          # =================================================

          def get_sheet_names():

              spreadsheet = (
                  sheets.spreadsheets()
                  .get(
                      spreadsheetId=SPREADSHEET_ID,
                      fields="sheets.properties"
                  )
                  .execute()
              )

              return {

                  item["properties"]["title"]

                  for item in spreadsheet.get(
                      "sheets",
                      []
                  )

              }


          def create_missing_sheets():

              existing = get_sheet_names()

              requests = []


              for sheet_name in SHEET_HEADERS:

                  if sheet_name not in existing:

                      requests.append({

                          "addSheet": {

                              "properties": {

                                  "title":
                                      sheet_name

                              }

                          }

                      })


              if requests:

                  (
                      sheets.spreadsheets()
                      .batchUpdate(
                          spreadsheetId=SPREADSHEET_ID,
                          body={
                              "requests":
                                  requests
                          }
                      )
                      .execute()
                  )


          def update_sheet(
              sheet_name,
              rows
          ):

              values = [

                  SHEET_HEADERS[
                      sheet_name
                  ]

              ]

              values.extend(
                  rows
              )


              # -------------------------------------------------
              # CLEAR OLD DATA
              # -------------------------------------------------

              (
                  sheets.spreadsheets()
                  .values()
                  .clear(
                      spreadsheetId=SPREADSHEET_ID,
                      range=f"{sheet_name}!A:ZZ",
                      body={}
                  )
                  .execute()
              )


              # -------------------------------------------------
              # WRITE NEW DATA
              # -------------------------------------------------

              (
                  sheets.spreadsheets()
                  .values()
                  .update(
                      spreadsheetId=SPREADSHEET_ID,
                      range=f"{sheet_name}!A1",
                      valueInputOption="RAW",
                      body={
                          "values":
                              values
                      }
                  )
                  .execute()
              )


              print(
                  "Sheet updated:",
                  sheet_name,
                  "Rows:",
                  len(rows)
              )


          # =================================================
          # MAIN
          # =================================================

          def main():

              print()
              print(
                  "=========================================="
              )
              print(
                  " MUSIC VAULT METADATA SCANNER"
              )
              print(
                  " GOOGLE SHEETS DATABASE"
              )
              print(
                  "=========================================="
              )


              # -------------------------------------------------
              # CREATE REQUIRED SHEETS
              # -------------------------------------------------

              create_missing_sheets()


              # -------------------------------------------------
              # LOAD OLD JSON
              # -------------------------------------------------

              old_data = {}


              if OUTPUT_JSON.exists():

                  try:

                      old_data = json.loads(
                          OUTPUT_JSON.read_text(
                              encoding="utf-8"
                          )
                      )

                  except Exception:

                      old_data = {}


              old_files = {

                  item.get("id"):
                      item

                  for item in old_data.get(
                      "files",
                      []
                  )

                  if item.get("id")

              }


              # -------------------------------------------------
              # COVER FOLDER
              # -------------------------------------------------

              cover_folder = (
                  find_cover_folder()
              )


              if cover_folder:

                  print(
                      "Cover folder:",
                      cover_folder["name"]
                  )

                  custom_covers = (
                      load_custom_covers(
                          cover_folder["id"]
                      )
                  )

              else:

                  print(
                      "WARNING: Cover folder not found."
                  )

                  custom_covers = []


              print(
                  "Custom covers:",
                  len(custom_covers)
              )


              # -------------------------------------------------
              # VIDEO FILES
              # -------------------------------------------------

              drive_files = (
                  list_drive_children(
                      VIDEO_FOLDER_ID
                  )
              )


              media_files = [

                  item

                  for item in drive_files

                  if Path(
                      item.get(
                          "name",
                          ""
                      )
                  ).suffix.lower()
                  in MEDIA_EXTENSIONS

              ]


              print(
                  "Video files found:",
                  len(media_files)
              )


              records = []

              files_rows = []

              video_rows = []

              audio_rows = []

              subtitle_rows = []

              cover_rows = []

              media_rows = []


              # -------------------------------------------------
              # PROCESS
              # -------------------------------------------------

              for number, drive_file in enumerate(
                  media_files,
                  start=1
              ):

                  file_id = drive_file["id"]

                  filename = drive_file["name"]

                  modified_time = drive_file.get(
                      "modifiedTime",
                      ""
                  )

                  file_size = drive_file.get(
                      "size",
                      ""
                  )


                  print()
                  print(
                      f"[{number}/{len(media_files)}] {filename}"
                  )


                  old_record = (
                      old_files.get(
                          file_id
                      )
                  )


                  # -------------------------------------------------
                  # TEMP PATH
                  # -------------------------------------------------

                  temp_path = (
                      TEMP_DIR
                      /
                      (
                          file_id
                          +
                          Path(
                              filename
                          ).suffix
                      )
                  )


                  try:

                      # -------------------------------------------------
                      # DOWNLOAD
                      # -------------------------------------------------

                      print(
                          "Downloading..."
                      )


                      download_drive_file(
                          file_id,
                          temp_path
                      )


                      # -------------------------------------------------
                      # FFPROBE
                      # -------------------------------------------------

                      print(
                          "FFprobe..."
                      )


                      probe = run_ffprobe(
                          temp_path
                      )


                      # -------------------------------------------------
                      # METADATA
                      # -------------------------------------------------

                      metadata = get_metadata(
                          probe,
                          filename
                      )


                      title = metadata[
                          "title"
                      ]

                      artist = metadata[
                          "artist"
                      ]


                      # -------------------------------------------------
                      # SCAN VIDEO
                      # -------------------------------------------------

                      video = scan_video(
                          probe.get(
                              "streams",
                              []
                          )
                      )


                      # -------------------------------------------------
                      # SCAN AUDIO
                      # -------------------------------------------------

                      audio = scan_audio(
                          probe.get(
                              "streams",
                              []
                          )
                      )


                      # -------------------------------------------------
                      # SCAN SUBTITLES
                      # -------------------------------------------------

                      subtitles = scan_subtitles(
                          probe.get(
                              "streams",
                              []
                          )
                      )


                      # =================================================
                      # COVER
                      # =================================================

                      cover_relative = ""

                      cover_source = ""

                      cover_drive_id = ""


                      # -------------------------------------------------
                      # CUSTOM DRIVE COVER
                      # -------------------------------------------------

                      matching_cover = (
                          find_matching_cover(
                              filename,
                              title,
                              custom_covers
                          )
                      )


                      if matching_cover:

                          cover_ext = (
                              Path(
                                  matching_cover[
                                      "name"
                                  ]
                              ).suffix.lower()
                          )


                          cover_filename = (
                              file_id
                              +
                              cover_ext
                          )


                          cover_path = (
                              COVERS_DIR
                              /
                              cover_filename
                          )


                          print(
                              "Custom cover:",
                              matching_cover[
                                  "name"
                              ]
                          )


                          download_drive_file(
                              matching_cover[
                                  "id"
                              ],
                              cover_path
                          )


                          cover_relative = (
                              "covers/"
                              +
                              cover_filename
                          )


                          cover_source = (
                              "google-drive-custom"
                          )


                          cover_drive_id = (
                              matching_cover[
                                  "id"
                              ]
                          )


                      # -------------------------------------------------
                      # EMBEDDED COVER
                      # -------------------------------------------------

                      if not cover_relative:

                          embedded_path = (
                              COVERS_DIR
                              /
                              (
                                  file_id
                                  +
                                  ".jpg"
                              )
                          )


                          print(
                              "Checking embedded cover..."
                          )


                          if extract_embedded_cover(
                              temp_path,
                              embedded_path
                          ):

                              cover_relative = (
                                  "covers/"
                                  +
                                  file_id
                                  +
                                  ".jpg"
                              )

                              cover_source = (
                                  "embedded"
                              )


                              print(
                                  "Embedded cover found."
                              )


                      # -------------------------------------------------
                      # GENERATED COVER
                      # -------------------------------------------------

                      if not cover_relative:

                          fallback_path = (
                              COVERS_DIR
                              /
                              (
                                  file_id
                                  +
                                  ".svg"
                              )
                          )


                          print(
                              "Generating fallback cover..."
                          )


                          generate_fallback_cover(
                              title,
                              artist,
                              fallback_path
                          )


                          cover_relative = (
                              "covers/"
                              +
                              file_id
                              +
                              ".svg"
                          )

                          cover_source = (
                              "generated"
                          )


                      # =================================================
                      # RECORD
                      # =================================================

                      record = {

                          "id":
                              file_id,

                          "fileName":
                              filename,

                          "fileSize":
                              file_size,

                          "modifiedTime":
                              modified_time,

                          "title":
                              title,

                          "artist":
                              artist,

                          "album":
                              metadata[
                                  "album"
                              ],

                          "composer":
                              metadata[
                                  "composer"
                              ],

                          "driveUrl":
                              drive_view_url(
                                  file_id
                              ),

                          "downloadUrl":
                              drive_download_url(
                                  file_id
                              ),

                          "video":
                              video,

                          "audio":
                              audio,

                          "subtitles":
                              subtitles,

                          "cover":
                              cover_relative,

                          "coverSource":
                              cover_source

                      }


                      # -------------------------------------------------
                      # PRESERVE PLAYBACK DATA
                      # -------------------------------------------------

                      if old_record:

                          playback_fields = [

                              "audioPlaybackAvailable",

                              "audioPlaybackCodec",

                              "audioPlaybackStream",

                              "audioPlaybackUrl",

                              "audioPlaybackFile"

                          ]


                          for field in playback_fields:

                              if field in old_record:

                                  record[field] = (
                                      old_record[field]
                                  )


                      records.append(
                          record
                      )


                      # =================================================
                      # FILES SHEET
                      # =================================================

                      files_rows.append([

                          file_id,

                          file_id,

                          filename,

                          Path(
                              filename
                          ).suffix.lower().replace(
                              ".",
                              ""
                          ),

                          file_size,

                          modified_time,

                          drive_view_url(
                              file_id
                          ),

                          drive_download_url(
                              file_id
                          )

                      ])


                      # =================================================
                      # VIDEO SHEET
                      # =================================================

                      if video:

                          video_rows.append([

                              file_id,

                              file_id,

                              filename,

                              video.get(
                                  "codec",
                                  ""
                              ),

                              video.get(
                                  "profile",
                                  ""
                              ),

                              video.get(
                                  "width",
                                  ""
                              ),

                              video.get(
                                  "height",
                                  ""
                              ),

                              video.get(
                                  "resolution",
                                  ""
                              ),

                              video.get(
                                  "aspectRatio",
                                  ""
                              ),

                              video.get(
                                  "fps",
                                  ""
                              ),

                              video.get(
                                  "bitrate",
                                  ""
                              ),

                              video.get(
                                  "bitDepth",
                                  ""
                              ),

                              video.get(
                                  "pixelFormat",
                                  ""
                              ),

                              video.get(
                                  "hdr",
                                  ""
                              ),

                              video.get(
                                  "scanType",
                                  ""
                              ),

                              video.get(
                                  "default",
                                  ""
                              )

                          ])


                      # =================================================
                      # AUDIO SHEET
                      # =================================================

                      for track in audio[
                          "tracks"
                      ]:

                          audio_id = (

                              file_id
                              +
                              "_A"
                              +
                              str(
                                  track[
                                      "trackNo"
                                  ]
                              )

                          )


                          audio_rows.append([

                              audio_id,

                              file_id,

                              track[
                                  "trackNo"
                              ],

                              track[
                                  "title"
                              ],

                              track[
                                  "codec"
                              ],

                              track[
                                  "sampleRate"
                              ],

                              track[
                                  "bitDepth"
                              ],

                              track[
                                  "channels"
                              ],

                              track[
                                  "channelLayout"
                              ],

                              track[
                                  "language"
                              ],

                              track[
                                  "hiRes"
                              ],

                              track[
                                  "default"
                              ]

                          ])


                      # =================================================
                      # SUBTITLE SHEET
                      # =================================================

                      for subtitle in subtitles:

                          subtitle_id = (

                              file_id
                              +
                              "_S"
                              +
                              str(
                                  subtitle[
                                      "trackNo"
                                  ]
                              )

                          )


                          subtitle_rows.append([

                              subtitle_id,

                              file_id,

                              subtitle[
                                  "trackNo"
                              ],

                              subtitle[
                                  "codec"
                              ],

                              subtitle[
                                  "language"
                              ],

                              subtitle[
                                  "title"
                              ],

                              subtitle[
                                  "default"
                              ],

                              subtitle[
                                  "forced"
                              ]

                          ])


                      # =================================================
                      # COVERS SHEET
                      # =================================================

                      if cover_relative:

                          if cover_drive_id:

                              cover_url = drive_view_url(
                                  cover_drive_id
                              )

                              cover_download = (
                                  drive_download_url(
                                      cover_drive_id
                                  )
                              )

                          else:

                              cover_url = ""

                              cover_download = ""


                          cover_rows.append([

                              file_id,

                              file_id,

                              Path(
                                  cover_relative
                              ).name,

                              cover_source,

                              cover_relative,

                              cover_url

                          ])


                      # =================================================
                      # MEDIA SHEET
                      # =================================================

                      resolution = ""

                      video_codec = ""

                      quality = ""

                      if video:

                          resolution = video.get(
                              "resolution",
                              ""
                          )

                          video_codec = video.get(
                              "codec",
                              ""
                          )

                          quality = video.get(
                              "quality",
                              ""
                          )


                      media_rows.append([

                          file_id,

                          title,

                          filename,

                          artist,

                          metadata[
                              "album"
                          ],

                          metadata[
                              "composer"
                          ],

                          resolution,

                          video_codec,

                          quality,

                          audio[
                              "trackCount"
                          ],

                          audio[
                              "hiResCount"
                          ],

                          len(
                              subtitles
                          ),

                          cover_relative,

                          cover_source,

                          drive_view_url(
                              file_id
                          ),

                          drive_download_url(
                              file_id
                          )

                      ])


                      print(
                          "Title:",
                          title
                      )

                      print(
                          "Video:",
                          quality
                      )

                      print(
                          "Audio tracks:",
                          audio[
                              "trackCount"
                          ]
                      )

                      print(
                          "Hi-Res audio:",
                          audio[
                              "hiResCount"
                          ]
                      )

                      print(
                          "Subtitles:",
                          len(
                              subtitles
                          )
                      )

                      print(
                          "Cover:",
                          cover_source
                      )


                  except Exception as error:

                      print(
                          "ERROR:",
                          filename,
                          error
                      )


                      # -------------------------------------------------
                      # KEEP OLD RECORD
                      # -------------------------------------------------

                      if old_record:

                          records.append(
                              old_record
                          )


                  finally:

                      if temp_path.exists():

                          temp_path.unlink()


              # =================================================
              # SAVE JSON
              # =================================================

              output = {

                  "generated":
                      True,

                  "scanner":
                      "Music Vault Metadata Scanner",

                  "version":
                      "2.0",

                  "videoFolderId":
                      VIDEO_FOLDER_ID,

                  "spreadsheetId":
                      SPREADSHEET_ID,

                  "coverSystem":
                      "custom-drive > embedded > generated",

                  "files":
                      records

              }


              OUTPUT_JSON.write_text(

                  json.dumps(
                      output,
                      ensure_ascii=False,
                      indent=2
                  ),

                  encoding="utf-8"

              )


              # =================================================
              # GOOGLE SHEETS
              # =================================================

              print()
              print(
                  "=========================================="
              )

              print(
                  "UPDATING GOOGLE SHEETS"
              )

              print(
                  "=========================================="
              )


              update_sheet(
                  "Media",
                  media_rows
              )


              update_sheet(
                  "Files",
                  files_rows
              )


              update_sheet(
                  "Video",
                  video_rows
              )


              update_sheet(
                  "Audio",
                  audio_rows
              )


              update_sheet(
                  "Subtitle",
                  subtitle_rows
              )


              update_sheet(
                  "Covers",
                  cover_rows
              )


              # =================================================
              # CLEAN
              # =================================================

              if TEMP_DIR.exists():

                  shutil.rmtree(
                      TEMP_DIR,
                      ignore_errors=True
                  )


              print()
              print(
                  "=========================================="
              )

              print(
                  "SCAN COMPLETE"
              )

              print(
                  "Media:",
                  len(
                      media_rows
                  )
              )

              print(
                  "Video:",
                  len(
                      video_rows
                  )
              )

              print(
                  "Audio:",
                  len(
                      audio_rows
                  )
              )

              print(
                  "Subtitle:",
                  len(
                      subtitle_rows
                  )
              )

              print(
                  "Covers:",
                  len(
                      cover_rows
                  )
              )

              print(
                  "=========================================="
              )


          # =================================================
          # RUN
          # =================================================

          if __name__ == "__main__":

              main()

          PYTHON


      # =====================================================
      # RUN SCANNER
      # =====================================================

      - name: Run Metadata Scanner
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |
          python scanner.py


      # =====================================================
      # SHOW JSON
      # =====================================================

      - name: Show Media JSON
        run: |

          echo "=========================================="

          echo "MEDIA.JSON"

          echo "=========================================="

          cat media.json


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit Metadata and Covers
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add media.json covers/


          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "Auto update MediaVerse metadata"

            git push

          fi
