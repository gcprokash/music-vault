name: Music Vault Metadata Scanner

on:
  workflow_dispatch:

  schedule:
    # প্রতি ৫ মিনিটে অটো রান
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout GitHub Repository
        uses: actions/checkout@v4


      # =====================================================
      # INSTALL FFMPEG
      # =====================================================

      - name: Install FFmpeg / FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      - name: Check FFprobe
        run: |
          ffprobe -version


      # =====================================================
      # INSTALL PYTHON PACKAGES
      # =====================================================

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2


      # =====================================================
      # CREATE SCANNER
      # =====================================================

      - name: Create Scanner
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          cat > scanner.py <<'PYTHON'

          import os
          import json
          import re
          import subprocess
          import shutil
          import html

          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload


          # =================================================
          # CONFIG
          # =================================================

          DRIVE_FOLDER_NAME = "Music Vault"

          OUTPUT_JSON = Path("media.json")

          COVERS_DIR = Path("covers")

          TEMP_DIR = Path("scanner_temp")


          MEDIA_EXTENSIONS = {
              ".mkv",
              ".mp4",
              ".webm",
              ".avi",
              ".mov",
              ".m4v",
              ".mp3",
              ".flac",
              ".wav",
              ".m4a",
              ".aac",
              ".ogg",
              ".opus"
          }


          IMAGE_EXTENSIONS = {
              ".jpg",
              ".jpeg",
              ".png",
              ".webp"
          }


          # =================================================
          # DIRECTORIES
          # =================================================

          COVERS_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          TEMP_DIR.mkdir(
              parents=True,
              exist_ok=True
          )


          # =================================================
          # GOOGLE DRIVE AUTH
          # =================================================

          service_account_json = os.environ.get(
              "GOOGLE_SERVICE_ACCOUNT_JSON"
          )

          if not service_account_json:

              raise RuntimeError(
                  "GOOGLE_SERVICE_ACCOUNT_JSON secret is missing."
              )


          credentials = (
              service_account.Credentials
              .from_service_account_info(
                  json.loads(
                      service_account_json
                  ),
                  scopes=[
                      "https://www.googleapis.com/auth/drive.readonly"
                  ]
              )
          )


          drive = build(
              "drive",
              "v3",
              credentials=credentials
          )


          # =================================================
          # NORMALIZE TEXT
          # =================================================

          def normalize_text(value):

              value = str(
                  value or ""
              )

              value = value.lower()

              value = re.sub(
                  r"\.[a-z0-9]{2,5}$",
                  "",
                  value
              )

              value = re.sub(
                  r"\[[^\]]*\]",
                  "",
                  value
              )

              value = re.sub(
                  r"\([^)]*\)",
                  "",
                  value
              )

              value = re.sub(
                  r"[_\-]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"[^a-z0-9\u0980-\u09ff]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          # =================================================
          # CLEAN TITLE
          # =================================================

          def clean_title(filename):

              name = Path(
                  filename
              ).stem

              name = re.sub(
                  r"\s*\[[^\]]*\].*$",
                  "",
                  name
              )

              name = re.sub(
                  r"\s+(2160p|1440p|1080p|720p)\b",
                  "",
                  name,
                  flags=re.I
              )

              return name.strip()


          # =================================================
          # FFPROBE
          # =================================================

          def run_ffprobe(path):

              command = [
                  "ffprobe",
                  "-v",
                  "quiet",
                  "-print_format",
                  "json",
                  "-show_format",
                  "-show_streams",
                  str(path)
              ]

              result = subprocess.run(
                  command,
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:

                  raise RuntimeError(
                      result.stderr
                  )

              return json.loads(
                  result.stdout
              )


          # =================================================
          # DOWNLOAD DRIVE FILE
          # =================================================

          def download_drive_file(
              file_id,
              destination
          ):

              request = (
                  drive.files()
                  .get_media(
                      fileId=file_id
                  )
              )

              with open(
                  destination,
                  "wb"
              ) as fh:

                  downloader = (
                      MediaIoBaseDownload(
                          fh,
                          request
                      )
                  )

                  done = False

                  while not done:

                      status, done = (
                          downloader.next_chunk()
                      )


          # =================================================
          # LIST DRIVE CHILDREN
          # =================================================

          def list_drive_children(
              folder_id
          ):

              files = []

              page_token = None

              while True:

                  response = (
                      drive.files()
                      .list(
                          q=(
                              f"'{folder_id}' in parents "
                              "and trashed = false"
                          ),
                          fields=(
                              "nextPageToken,"
                              "files(id,name,mimeType,size)"
                          ),
                          pageSize=1000,
                          pageToken=page_token
                      )
                      .execute()
                  )

                  files.extend(
                      response.get(
                          "files",
                          []
                      )
                  )

                  page_token = (
                      response.get(
                          "nextPageToken"
                      )
                  )

                  if not page_token:
                      break

              return files


          # =================================================
          # FIND MUSIC VAULT
          # =================================================

          def find_music_vault_folder():

              response = (
                  drive.files()
                  .list(
                      q=(
                          "name = 'Music Vault' "
                          "and mimeType = "
                          "'application/vnd.google-apps.folder' "
                          "and trashed = false"
                      ),
                      fields="files(id,name)",
                      pageSize=100
                  )
                  .execute()
              )

              folders = response.get(
                  "files",
                  []
              )

              if not folders:

                  raise RuntimeError(
                      "Music Vault folder not found."
                  )

              return folders[0]


          # =================================================
          # FIND COVER FOLDER
          # =================================================

          def find_cover_folder(
              music_vault_id
          ):

              children = list_drive_children(
                  music_vault_id
              )

              for item in children:

                  if (
                      item.get("mimeType")
                      ==
                      "application/vnd.google-apps.folder"
                      and
                      item.get(
                          "name",
                          ""
                      ).lower()
                      ==
                      "cover"
                  ):

                      return item

              return None


          # =================================================
          # LOAD CUSTOM COVERS
          # =================================================

          def load_custom_covers(
              cover_folder_id
          ):

              if not cover_folder_id:

                  return []

              children = list_drive_children(
                  cover_folder_id
              )

              covers = []

              for item in children:

                  name = item.get(
                      "name",
                      ""
                  )

                  ext = Path(
                      name
                  ).suffix.lower()

                  if ext not in IMAGE_EXTENSIONS:
                      continue

                  covers.append(
                      item
                  )

              return covers


          # =================================================
          # FIND MATCHING COVER
          # =================================================

          def find_matching_cover(
              media_filename,
              media_title,
              custom_covers
          ):

              targets = [

                  normalize_text(
                      media_filename
                  ),

                  normalize_text(
                      media_title
                  )

              ]

              targets = [
                  value
                  for value in targets
                  if value
              ]

              if not targets:
                  return None


              # -------------------------------------------------
              # EXACT MATCH
              # -------------------------------------------------

              for cover in custom_covers:

                  cover_name = normalize_text(
                      cover.get(
                          "name",
                          ""
                      )
                  )

                  for target in targets:

                      if cover_name == target:

                          return cover


              # -------------------------------------------------
              # PARTIAL MATCH
              # -------------------------------------------------

              for cover in custom_covers:

                  cover_name = normalize_text(
                      cover.get(
                          "name",
                          ""
                      )
                  )

                  for target in targets:

                      if (
                          cover_name.startswith(
                              target
                          )
                          or
                          target.startswith(
                              cover_name
                          )
                      ):

                          return cover


              return None


          # =================================================
          # EXTRACT EMBEDDED COVER
          # =================================================

          def extract_embedded_cover(
              media_path,
              output_path
          ):

              command = [

                  "ffmpeg",

                  "-y",

                  "-i",
                  str(media_path),

                  "-map",
                  "0:v:m:attached_pic",

                  "-frames:v",
                  "1",

                  str(output_path)
              ]

              result = subprocess.run(
                  command,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              return (
                  result.returncode == 0
                  and output_path.exists()
                  and output_path.stat().st_size > 0
              )


          # =================================================
          # PREMIUM GENERATED FALLBACK COVER
          # =================================================

          def generate_fallback_cover(
              title,
              artist,
              output_path
          ):

              # -------------------------------------------------
              # CLEAN DISPLAY TITLE
              # -------------------------------------------------

              display_title = str(
                  title or "Music"
              )

              display_artist = str(
                  artist or "Music Vault"
              )


              # Remove technical tags
              display_title = re.sub(
                  r"\s*\[[^\]]*\]",
                  "",
                  display_title
              )

              display_title = re.sub(
                  r"\s*\([^)]*\)",
                  "",
                  display_title
              )

              display_title = re.sub(
                  r"\s+(2160p|1440p|1080p|720p)\b",
                  "",
                  display_title,
                  flags=re.I
              )

              display_title = re.sub(
                  r"\s+",
                  " ",
                  display_title
              ).strip()


              if not display_title:

                  display_title = "Music"


              # -------------------------------------------------
              # ESCAPE SVG TEXT
              # -------------------------------------------------

              safe_artist = html.escape(
                  display_artist
              )


              # -------------------------------------------------
              # TITLE WRAPPING
              # -------------------------------------------------

              words = display_title.split()

              title_lines = []

              current_line = ""

              MAX_CHARS = 22


              for word in words:

                  test_line = (
                      word
                      if not current_line
                      else current_line + " " + word
                  )


                  if len(test_line) <= MAX_CHARS:

                      current_line = test_line

                  else:

                      if current_line:

                          title_lines.append(
                              current_line
                          )

                      current_line = word


              if current_line:

                  title_lines.append(
                      current_line
                  )


              # Maximum 3 lines
              title_lines = title_lines[:3]


              # -------------------------------------------------
              # SVG TITLE ELEMENTS
              # -------------------------------------------------

              title_svg = ""

              start_y = 690

              line_gap = 58


              for index, line in enumerate(
                  title_lines
              ):

                  safe_line = html.escape(
                      line
                  )

                  y = (
                      start_y
                      + (index * line_gap)
                  )


                  title_svg += f'''
          <text
              x="500"
              y="{y}"
              text-anchor="middle"
              fill="#ffffff"
              font-size="46"
              font-family="Arial, sans-serif"
              font-weight="700">

              {safe_line}

          </text>
          '''


              # -------------------------------------------------
              # SVG
              # -------------------------------------------------

              svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          width="1000"
          height="1000"
          viewBox="0 0 1000 1000">

          <defs>

              <!-- Premium Background -->

              <linearGradient
                  id="bg"
                  x1="0"
                  y1="0"
                  x2="1"
                  y2="1">

                  <stop
                      offset="0%"
                      stop-color="#12082d"/>

                  <stop
                      offset="45%"
                      stop-color="#4c1d95"/>

                  <stop
                      offset="100%"
                      stop-color="#160b35"/>

              </linearGradient>


              <!-- Main Glow -->

              <radialGradient
                  id="glow">

                  <stop
                      offset="0%"
                      stop-color="#a855f7"
                      stop-opacity="0.95"/>

                  <stop
                      offset="45%"
                      stop-color="#7c3aed"
                      stop-opacity="0.45"/>

                  <stop
                      offset="100%"
                      stop-color="#7c3aed"
                      stop-opacity="0"/>

              </radialGradient>


              <!-- Secondary Glow -->

              <radialGradient
                  id="glow2">

                  <stop
                      offset="0%"
                      stop-color="#6366f1"
                      stop-opacity="0.65"/>

                  <stop
                      offset="100%"
                      stop-color="#6366f1"
                      stop-opacity="0"/>

              </radialGradient>


              <!-- Glass Ring -->

              <linearGradient
                  id="ring"
                  x1="0"
                  y1="0"
                  x2="1"
                  y2="1">

                  <stop
                      offset="0%"
                      stop-color="#ffffff"
                      stop-opacity="0.30"/>

                  <stop
                      offset="100%"
                      stop-color="#ffffff"
                      stop-opacity="0.05"/>

              </linearGradient>

          </defs>


          <!-- =========================================
               BACKGROUND
               ========================================= -->

          <rect
              width="1000"
              height="1000"
              fill="url(#bg)"/>


          <!-- =========================================
               DECORATIVE GLOWS
               ========================================= -->

          <circle
              cx="210"
              cy="170"
              r="280"
              fill="url(#glow2)"/>


          <circle
              cx="790"
              cy="760"
              r="330"
              fill="url(#glow)"/>


          <circle
              cx="500"
              cy="380"
              r="360"
              fill="url(#glow)"/>


          <!-- =========================================
               OUTER RINGS
               ========================================= -->

          <circle
              cx="500"
              cy="380"
              r="220"
              fill="none"
              stroke="url(#ring)"
              stroke-width="3"/>


          <circle
              cx="500"
              cy="380"
              r="170"
              fill="none"
              stroke="#ffffff"
              stroke-opacity="0.14"
              stroke-width="2"/>


          <circle
              cx="500"
              cy="380"
              r="125"
              fill="none"
              stroke="#ffffff"
              stroke-opacity="0.18"
              stroke-width="2"/>


          <!-- =========================================
               CENTER DISC
               ========================================= -->

          <circle
              cx="500"
              cy="380"
              r="82"
              fill="#ffffff"
              fill-opacity="0.06"
              stroke="#ffffff"
              stroke-opacity="0.22"
              stroke-width="2"/>


          <!-- =========================================
               MUSIC ICON
               ========================================= -->

          <text
              x="500"
              y="415"
              text-anchor="middle"
              fill="#ffffff"
              font-size="105"
              font-family="Arial, sans-serif"
              font-weight="700">

              ♪

          </text>


          <!-- =========================================
               SMALL LABEL
               ========================================= -->

          <text
              x="500"
              y="560"
              text-anchor="middle"
              fill="#ddd6fe"
              font-size="22"
              font-family="Arial, sans-serif"
              font-weight="600"
              letter-spacing="7">

              MUSIC RELEASE

          </text>


          <!-- =========================================
               SONG TITLE
               ========================================= -->

          {title_svg}


          <!-- =========================================
               ARTIST
               ========================================= -->

          <text
              x="500"
              y="875"
              text-anchor="middle"
              fill="#ddd6fe"
              font-size="28"
              font-family="Arial, sans-serif">

              {safe_artist}

          </text>


          <!-- =========================================
               MUSIC VAULT BRAND
               ========================================= -->

          <text
              x="500"
              y="935"
              text-anchor="middle"
              fill="#ffffff"
              fill-opacity="0.42"
              font-size="20"
              font-family="Arial, sans-serif"
              font-weight="600"
              letter-spacing="6">

              MUSIC VAULT

          </text>


          </svg>'''


              # -------------------------------------------------
              # SAVE SVG
              # -------------------------------------------------

              output_path.write_text(
                  svg,
                  encoding="utf-8"
              )


          # =================================================
          # AUDIO SCANNER
          # =================================================

          def scan_audio(
              streams
          ):

              audio_streams = [

                  stream

                  for stream in streams

                  if stream.get(
                      "codec_type"
                  )
                  ==
                  "audio"

              ]


              tracks = []

              hi_res_index = None


              for index, stream in enumerate(
                  audio_streams
              ):

                  tags = stream.get(
                      "tags",
                      {}
                  )


                  codec = (
                      stream.get(
                          "codec_name"
                      )
                      or ""
                  ).lower()


                  try:

                      sample_rate = int(
                          stream.get(
                              "sample_rate",
                              0
                          )
                          or 0
                      )

                  except Exception:

                      sample_rate = 0


                  try:

                      bits = int(
                          stream.get(
                              "bits_per_raw_sample",
                              0
                          )
                          or 0
                      )

                  except Exception:

                      bits = 0


                  title = tags.get(
                      "title",
                      ""
                  )


                  language = tags.get(
                      "language",
                      ""
                  )


                  track = {

                      "index":
                          index,

                      "codec":
                          codec,

                      "sampleRate":
                          sample_rate,

                      "bitDepth":
                          bits,

                      "channels":
                          stream.get(
                              "channels"
                          ),

                      "channelLayout":
                          stream.get(
                              "channel_layout"
                          ),

                      "language":
                          language,

                      "title":
                          title

                  }


                  tracks.append(
                      track
                  )


                  title_lower = (
                      title.lower()
                  )


                  is_hires = (

                      codec in {
                          "alac",
                          "flac",
                          "wavpack",
                          "ape",
                          "pcm_s16le",
                          "pcm_s24le",
                          "pcm_s32le"
                      }

                      or
                      "hi-res" in title_lower

                      or
                      "hires" in title_lower

                      or
                      sample_rate >= 96000

                      or
                      bits >= 24

                  )


                  if (
                      is_hires
                      and
                      hi_res_index is None
                  ):

                      hi_res_index = index


              return {

                  "trackCount":
                      len(tracks),

                  "tracks":
                      tracks,

                  "hiResTrack":
                      hi_res_index

              }


          # =================================================
          # VIDEO SCANNER
          # =================================================

          def scan_video(
              streams
          ):

              video_streams = [

                  stream

                  for stream in streams

                  if (
                      stream.get(
                          "codec_type"
                      )
                      ==
                      "video"
                  )
                  and
                  not (
                      stream.get(
                          "disposition",
                          {}
                      ).get(
                          "attached_pic",
                          0
                      )
                  )

              ]


              if not video_streams:

                  return None


              stream = video_streams[0]


              width = int(
                  stream.get(
                      "width",
                      0
                  )
                  or 0
              )


              height = int(
                  stream.get(
                      "height",
                      0
                  )
                  or 0
              )


              return {

                  "width":
                      width,

                  "height":
                      height,

                  "resolution":
                      f"{width}x{height}",

                  "codec":
                      stream.get(
                          "codec_name",
                          ""
                      )

              }


          # =================================================
          # SUBTITLE SCANNER
          # =================================================

          def scan_subtitles(
              streams
          ):

              subtitles = []


              for index, stream in enumerate(
                  streams
              ):

                  if (
                      stream.get(
                          "codec_type"
                      )
                      !=
                      "subtitle"
                  ):

                      continue


                  tags = stream.get(
                      "tags",
                      {}
                  )


                  subtitles.append({

                      "index":
                          index,

                      "codec":
                          stream.get(
                              "codec_name",
                              ""
                          ),

                      "language":
                          tags.get(
                              "language",
                              ""
                          ),

                      "title":
                          tags.get(
                              "title",
                              ""
                          )

                  })


              return subtitles


          # =================================================
          # METADATA
          # =================================================

          def get_metadata(
              probe,
              filename
          ):

              format_data = probe.get(
                  "format",
                  {}
              )


              tags = format_data.get(
                  "tags",
                  {}
              )


              title = (

                  tags.get(
                      "title"
                  )

                  or

                  clean_title(
                      filename
                  )

              )


              artist = (

                  tags.get(
                      "artist"
                  )

                  or

                  tags.get(
                      "album_artist"
                  )

                  or
                  ""

              )


              album = (

                  tags.get(
                      "album"
                  )

                  or
                  ""

              )


              composer = (

                  tags.get(
                      "composer"
                  )

                  or
                  ""

              )


              return {

                  "title":
                      title.strip(),

                  "artist":
                      artist.strip(),

                  "album":
                      album.strip(),

                  "composer":
                      composer.strip()

              }


          # =================================================
          # MAIN
          # =================================================

          def main():

              print(
                  "=========================================="
              )

              print(
                  " MUSIC VAULT METADATA SCANNER"
              )

              print(
                  " COVER AUTOMATION ENABLED"
              )

              print(
                  " PRIORITY: CUSTOM > EMBEDDED > GENERATED"
              )

              print(
                  "=========================================="
              )


              # ---------------------------------------------
              # MUSIC VAULT
              # ---------------------------------------------

              music_vault = (
                  find_music_vault_folder()
              )

              music_vault_id = (
                  music_vault["id"]
              )


              print(
                  "Music Vault ID:",
                  music_vault_id
              )


              # ---------------------------------------------
              # COVER FOLDER
              # ---------------------------------------------

              cover_folder = (
                  find_cover_folder(
                      music_vault_id
                  )
              )


              if cover_folder:

                  print(
                      "Cover folder found:",
                      cover_folder["id"]
                  )


                  custom_covers = (
                      load_custom_covers(
                          cover_folder["id"]
                      )
                  )


              else:

                  print(
                      "Cover folder not found."
                  )

                  custom_covers = []


              print(
                  "Custom covers:",
                  len(custom_covers)
              )


              # ---------------------------------------------
              # LOAD OLD media.json
              # ---------------------------------------------

              old_data = {}


              if OUTPUT_JSON.exists():

                  try:

                      old_data = json.loads(
                          OUTPUT_JSON.read_text(
                              encoding="utf-8"
                          )
                      )

                  except Exception:

                      old_data = {}


              old_files = {

                  item.get("id"):
                      item

                  for item in old_data.get(
                      "files",
                      []
                  )

                  if item.get("id")

              }


              # ---------------------------------------------
              # DRIVE MEDIA FILES
              # ---------------------------------------------

              drive_files = (
                  list_drive_children(
                      music_vault_id
                  )
              )


              media_files = []


              for item in drive_files:

                  name = item.get(
                      "name",
                      ""
                  )


                  ext = Path(
                      name
                  ).suffix.lower()


                  if ext in MEDIA_EXTENSIONS:

                      media_files.append(
                          item
                      )


              print(
                  "Media files found:",
                  len(media_files)
              )


              records = []


              # ---------------------------------------------
              # PROCESS MEDIA
              # ---------------------------------------------

              for number, drive_file in enumerate(
                  media_files,
                  start=1
              ):

                  file_id = (
                      drive_file["id"]
                  )

                  filename = (
                      drive_file["name"]
                  )


                  print()

                  print(
                      f"[{number}/{len(media_files)}]",
                      filename
                  )


                  # -----------------------------------------
                  # TEMPORARY FILE
                  # -----------------------------------------

                  temp_path = (
                      TEMP_DIR
                      /
                      (
                          file_id
                          +
                          Path(
                              filename
                          ).suffix
                      )
                  )


                  try:

                      # -------------------------------------
                      # DOWNLOAD MEDIA
                      # -------------------------------------

                      print(
                          "Downloading media..."
                      )


                      download_drive_file(
                          file_id,
                          temp_path
                      )


                      # -------------------------------------
                      # FFPROBE
                      # -------------------------------------

                      print(
                          "Running FFprobe..."
                      )


                      probe = run_ffprobe(
                          temp_path
                      )


                      # -------------------------------------
                      # METADATA
                      # -------------------------------------

                      metadata = get_metadata(
                          probe,
                          filename
                      )


                      title = metadata[
                          "title"
                      ]


                      artist = metadata[
                          "artist"
                      ]


                      print(
                          "Title:",
                          title
                      )


                      print(
                          "Artist:",
                          artist
                      )


                      # -------------------------------------
                      # VIDEO
                      # -------------------------------------

                      video = scan_video(
                          probe.get(
                              "streams",
                              []
                          )
                      )


                      # -------------------------------------
                      # AUDIO
                      # -------------------------------------

                      audio = scan_audio(
                          probe.get(
                              "streams",
                              []
                          )
                      )


                      # -------------------------------------
                      # SUBTITLES
                      # -------------------------------------

                      subtitles = scan_subtitles(
                          probe.get(
                              "streams",
                              []
                          )
                      )


                      # =====================================
                      # COVER SYSTEM
                      # =====================================

                      cover_relative = ""

                      cover_source = ""


                      # -------------------------------------
                      # PRIORITY 1
                      # CUSTOM DRIVE COVER
                      # -------------------------------------

                      matching_cover = (
                          find_matching_cover(
                              filename,
                              title,
                              custom_covers
                          )
                      )


                      if matching_cover:

                          cover_ext = (
                              Path(
                                  matching_cover[
                                      "name"
                                  ]
                              ).suffix.lower()
                          )


                          cover_filename = (
                              file_id
                              +
                              cover_ext
                          )


                          cover_path = (
                              COVERS_DIR
                              /
                              cover_filename
                          )


                          print(
                              "Custom cover:",
                              matching_cover[
                                  "name"
                              ]
                          )


                          download_drive_file(
                              matching_cover[
                                  "id"
                              ],
                              cover_path
                          )


                          cover_relative = (
                              "covers/"
                              +
                              cover_filename
                          )


                          cover_source = (
                              "google-drive-custom"
                          )


                      # -------------------------------------
                      # PRIORITY 2
                      # EMBEDDED COVER
                      # -------------------------------------

                      if not cover_relative:

                          embedded_path = (
                              COVERS_DIR
                              /
                              (
                                  file_id
                                  +
                                  ".jpg"
                              )
                          )


                          print(
                              "Checking embedded cover..."
                          )


                          if extract_embedded_cover(
                              temp_path,
                              embedded_path
                          ):

                              cover_relative = (
                                  "covers/"
                                  +
                                  file_id
                                  +
                                  ".jpg"
                              )


                              cover_source = (
                                  "embedded"
                              )


                              print(
                                  "Embedded cover found."
                              )


                      # -------------------------------------
                      # PRIORITY 3
                      # GENERATED COVER
                      # -------------------------------------

                      if not cover_relative:

                          fallback_path = (
                              COVERS_DIR
                              /
                              (
                                  file_id
                                  +
                                  ".svg"
                              )
                          )


                          print(
                              "Generating premium fallback cover..."
                          )


                          generate_fallback_cover(
                              title,
                              artist,
                              fallback_path
                          )


                          cover_relative = (
                              "covers/"
                              +
                              file_id
                              +
                              ".svg"
                          )


                          cover_source = (
                              "generated"
                          )


                      # =====================================
                      # RECORD
                      # =====================================

                      record = {

                          "id":
                              file_id,

                          "fileName":
                              filename,

                          "title":
                              title,

                          "artist":
                              artist,

                          "album":
                              metadata[
                                  "album"
                              ],

                          "composer":
                              metadata[
                                  "composer"
                              ],

                          "driveUrl":
                              (
                                  "https://drive.google.com/"
                                  "file/d/"
                                  +
                                  file_id
                                  +
                                  "/view"
                              ),

                          "downloadUrl":
                              (
                                  "https://drive.google.com/"
                                  "uc?export=download&id="
                                  +
                                  file_id
                              ),

                          "video":
                              video,

                          "audio":
                              audio,

                          "subtitles":
                              subtitles,

                          "cover":
                              cover_relative,

                          "coverSource":
                              cover_source

                      }


                      # =====================================
                      # PRESERVE PLAYBACK DATA
                      # =====================================

                      old_record = (
                          old_files.get(
                              file_id
                          )
                      )


                      if old_record:

                          playback_fields = [

                              "audioPlaybackAvailable",

                              "audioPlaybackCodec",

                              "audioPlaybackStream",

                              "audioPlaybackUrl",

                              "audioPlaybackFile"

                          ]


                          for field in playback_fields:

                              if field in old_record:

                                  record[field] = (
                                      old_record[field]
                                  )


                      records.append(
                          record
                      )


                      print(
                          "Cover source:",
                          cover_source
                      )


                  except Exception as error:

                      print(
                          "ERROR:",
                          filename,
                          error
                      )


                      # -------------------------------------
                      # KEEP OLD RECORD
                      # -------------------------------------

                      old_record = (
                          old_files.get(
                              file_id
                          )
                      )


                      if old_record:

                          records.append(
                              old_record
                          )


                  finally:

                      # -------------------------------------
                      # REMOVE TEMP MEDIA
                      # -------------------------------------

                      if temp_path.exists():

                          temp_path.unlink()


              # =================================================
              # SAVE media.json
              # =================================================

              output = {

                  "generated":
                      True,

                  "scanner":
                      "Music Vault Metadata Scanner",

                  "coverSystem":
                      "custom-drive > embedded > generated",

                  "files":
                      records

              }


              OUTPUT_JSON.write_text(

                  json.dumps(
                      output,
                      ensure_ascii=False,
                      indent=2
                  ),

                  encoding="utf-8"

              )


              # =================================================
              # CLEAN TEMP DIRECTORY
              # =================================================

              if TEMP_DIR.exists():

                  shutil.rmtree(
                      TEMP_DIR,
                      ignore_errors=True
                  )


              print()

              print(
                  "=========================================="
              )

              print(
                  "SCAN COMPLETE"
              )

              print(
                  "Files:",
                  len(records)
              )

              print(
                  "==========================================" 
              )


          # =================================================
          # RUN
          # =================================================

          if __name__ == "__main__":

              main()

          PYTHON


      # =====================================================
      # RUN SCANNER
      # =====================================================

      - name: Run Metadata Scanner
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |
          python scanner.py


      # =====================================================
      # SHOW RESULT
      # =====================================================

      - name: Show Media JSON
        run: |

          echo "=========================================="

          echo "MEDIA.JSON"

          echo "=========================================="

          cat media.json


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit Metadata and Covers
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add media.json covers/


          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "Auto update Music Vault metadata and covers"

            git push

          fi
