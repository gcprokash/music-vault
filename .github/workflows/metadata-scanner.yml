name: Music Vault Metadata Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout GitHub Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Install FFmpeg / FFprobe
      # ==========================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ==========================================
      # 3. Check FFprobe
      # ==========================================
      - name: Check FFprobe
        run: |
          ffprobe -version

      # ==========================================
      # 4. Install Python packages
      # ==========================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      # ==========================================
      # 5. Create Scanner
      # ==========================================
      - name: Create scanner
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |

          cat > scanner.py <<'PY'

          import os
          import json
          import subprocess
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload


          # ============================================================
          # MUSIC VAULT — METADATA SCANNER
          # Google Drive → FFprobe → media.json
          # ============================================================

          FOLDER_NAME = "Music Vault"
          OUTPUT_FILE = "media.json"

          SERVICE_ACCOUNT_JSON = os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]

          SCOPES = [
              "https://www.googleapis.com/auth/drive.readonly"
          ]


          # ============================================================
          # GOOGLE DRIVE
          # ============================================================

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(SERVICE_ACCOUNT_JSON),
              scopes=SCOPES
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials
          )


          # ============================================================
          # HELPERS
          # ============================================================

          def clean_title(filename):

              name = Path(filename).stem

              # Remove everything beginning with the first metadata tag.
              # Example:
              # Chumu 2K [1440p] [VP9] [Multi Audio] [GCP]
              #
              # becomes:
              # Chumu 2K

              if "[" in name:
                  name = name.split("[", 1)[0]

              return name.strip()


          def get_extension(filename):

              return Path(filename).suffix.lower().replace(".", "")


          def is_media_file(filename):

              extensions = {
                  "mkv",
                  "mp4",
                  "webm",
                  "avi",
                  "mov",
                  "m4v",
                  "mp3",
                  "flac",
                  "wav",
                  "m4a",
                  "aac",
                  "ogg",
                  "opus"
              }

              return get_extension(filename) in extensions


          def run_ffprobe(file_path):

              command = [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_format",
                  "-show_streams",
                  "-of",
                  "json",
                  str(file_path)
              ]

              result = subprocess.run(
                  command,
                  capture_output=True,
                  text=True,
                  check=True
              )

              return json.loads(result.stdout)


          def safe_int(value, default=0):

              try:
                  return int(value)
              except:
                  return default


          def safe_float(value, default=0):

              try:
                  return float(value)
              except:
                  return default


          def fraction_to_fps(value):

              if not value:
                  return ""

              try:
                  if "/" in str(value):
                      a, b = value.split("/", 1)

                      a = float(a)
                      b = float(b)

                      if b == 0:
                          return ""

                      fps = a / b

                      if fps.is_integer():
                          return str(int(fps))

                      return f"{fps:.3f}".rstrip("0").rstrip(".")

                  return str(value)

              except:
                  return str(value)


          def get_tags(stream):

              tags = stream.get("tags", {})

              result = {}

              for key, value in tags.items():

                  result[str(key).lower()] = value

              return result


          # ============================================================
          # VIDEO METADATA
          # ============================================================

          def scan_video(streams):

              video_streams = [
                  s for s in streams
                  if s.get("codec_type") == "video"
              ]

              if not video_streams:
                  return None

              stream = video_streams[0]

              width = safe_int(stream.get("width"))
              height = safe_int(stream.get("height"))

              return {
                  "codec": stream.get("codec_name", ""),
                  "codecLong": stream.get("codec_long_name", ""),
                  "width": width,
                  "height": height,
                  "resolution": (
                      f"{width}x{height}"
                      if width and height
                      else ""
                  ),
                  "fps": fraction_to_fps(
                      stream.get("r_frame_rate", "")
                  ),
                  "bitrate": stream.get("bit_rate", ""),
                  "pixelFormat": stream.get("pix_fmt", "")
              }


          # ============================================================
          # AUDIO METADATA
          # ============================================================

          def is_hi_res_candidate(stream):

              codec = str(
                  stream.get("codec_name", "")
              ).lower()

              sample_rate = safe_int(
                  stream.get("sample_rate")
              )

              bit_depth = safe_int(
                  stream.get("bits_per_raw_sample")
              )

              title = str(
                  get_tags(stream).get("title", "")
              ).lower()

              # Lossless formats commonly used for Hi-Res.
              if codec in {"alac", "flac", "wavpack", "pcm_s16le",
                           "pcm_s24le", "pcm_s32le", "ape"}:

                  return True

              # Metadata title explicitly says Hi-Res.
              if "hi-res" in title or "hi res" in title:

                  return True

              # High sample rate.
              if sample_rate >= 96000:

                  return True

              # 24-bit / higher.
              if bit_depth >= 24:

                  return True

              return False


          def scan_audio(streams):

              audio_streams = [
                  s for s in streams
                  if s.get("codec_type") == "audio"
              ]

              tracks = []

              hi_res_index = None

              for position, stream in enumerate(audio_streams, start=1):

                  tags = get_tags(stream)

                  codec = stream.get(
                      "codec_name",
                      ""
                  )

                  sample_rate = safe_int(
                      stream.get("sample_rate")
                  )

                  bit_depth = safe_int(
                      stream.get("bits_per_raw_sample")
                  )

                  track = {

                      "index": position,

                      "codec": codec,

                      "codecLong": stream.get(
                          "codec_long_name",
                          ""
                      ),

                      "language": tags.get(
                          "language",
                          ""
                      ),

                      "title": tags.get(
                          "title",
                          ""
                      ),

                      "artist": tags.get(
                          "artist",
                          ""
                      ),

                      "album": tags.get(
                          "album",
                          ""
                      ),

                      "composer": tags.get(
                          "composer",
                          ""
                      ),

                      "sampleRate": (
                          str(sample_rate)
                          if sample_rate
                          else ""
                      ),

                      "bitDepth": bit_depth,

                      "channels": safe_int(
                          stream.get("channels")
                      ),

                      "channelLayout": stream.get(
                          "channel_layout",
                          ""
                      ),

                      "bitrate": stream.get(
                          "bit_rate",
                          ""
                      ),

                      "default": (
                          stream.get("disposition", {})
                          .get("default", 0) == 1
                      ),

                      "forced": (
                          stream.get("disposition", {})
                          .get("forced", 0) == 1
                      )
                  }

                  tracks.append(track)

                  if (
                      hi_res_index is None
                      and is_hi_res_candidate(stream)
                  ):

                      hi_res_index = position


              # If no candidate was detected, look specifically
              # for ALAC/FLAC as the Hi-Res track.
              if hi_res_index is None:

                  for position, track in enumerate(
                      tracks,
                      start=1
                  ):

                      if track["codec"].lower() in {
                          "alac",
                          "flac"
                      }:

                          hi_res_index = position
                          break


              hi_res_metadata = {
                  "artist": "",
                  "album": "",
                  "title": "",
                  "composer": ""
              }

              if hi_res_index:

                  selected = tracks[
                      hi_res_index - 1
                  ]

                  # IMPORTANT:
                  # Artist is taken ONLY from the
                  # Hi-Res Audio track.
                  hi_res_metadata = {
                      "artist": selected.get(
                          "artist",
                          ""
                      ),

                      "album": selected.get(
                          "album",
                          ""
                      ),

                      "title": selected.get(
                          "title",
                          ""
                      ),

                      "composer": selected.get(
                          "composer",
                          ""
                      )
                  }


              return {
                  "trackCount": len(tracks),

                  "multiAudio": len(tracks) > 1,

                  "hiResTrack": hi_res_index,

                  "tracks": tracks
              }, hi_res_metadata


          # ============================================================
          # SUBTITLE METADATA
          # ============================================================

          def scan_subtitles(streams):

              subtitle_streams = [
                  s for s in streams
                  if s.get("codec_type") == "subtitle"
              ]

              tracks = []

              for position, stream in enumerate(
                  subtitle_streams,
                  start=1
              ):

                  tags = get_tags(stream)

                  tracks.append({

                      "index": position,

                      "codec": stream.get(
                          "codec_name",
                          ""
                      ),

                      "language": tags.get(
                          "language",
                          ""
                      ),

                      "title": tags.get(
                          "title",
                          ""
                      ),

                      "default": (
                          stream.get(
                              "disposition",
                              {}
                          ).get(
                              "default",
                              0
                          ) == 1
                      ),

                      "forced": (
                          stream.get(
                              "disposition",
                              {}
                          ).get(
                              "forced",
                              0
                          ) == 1
                      )
                  })


              return {
                  "trackCount": len(tracks),
                  "tracks": tracks
              }


          # ============================================================
          # FIND MUSIC VAULT FOLDER
          # ============================================================

          print("========================================")
          print(" MUSIC VAULT METADATA SCANNER")
          print("========================================")


          folder_results = drive.files().list(

              q=(
                  f"name = '{FOLDER_NAME}' "
                  "and mimeType = "
                  "'application/vnd.google-apps.folder' "
                  "and trashed = false"
              ),

              spaces="drive",

              fields="files(id,name)"

          ).execute()


          folders = folder_results.get(
              "files",
              []
          )


          if not folders:

              raise RuntimeError(
                  "Music Vault folder পাওয়া যায়নি।"
              )


          folder = folders[0]

          folder_id = folder["id"]

          print("Folder:", folder["name"])
          print("Folder ID:", folder_id)


          # ============================================================
          # GET FILES
          # ============================================================

          results = drive.files().list(

              q=(
                  f"'{folder_id}' in parents "
                  "and trashed = false"
              ),

              spaces="drive",

              fields=(
                  "files("
                  "id,"
                  "name,"
                  "mimeType,"
                  "size,"
                  "createdTime,"
                  "modifiedTime,"
                  "webViewLink"
                  ")"
              )

          ).execute()


          files = results.get(
              "files",
              []
          )


          media_files = [
              f for f in files
              if is_media_file(f["name"])
          ]


          print("")
          print(
              "Media files found:",
              len(media_files)
          )


          # ============================================================
          # SCAN MEDIA
          # ============================================================

          catalog_files = []

          with tempfile.TemporaryDirectory() as temp_dir:

              temp_dir = Path(temp_dir)

              for file in media_files:

                  file_id = file["id"]
                  file_name = file["name"]

                  print("")
                  print("----------------------------------------")
                  print("Scanning:", file_name)
                  print("----------------------------------------")

                  local_file = temp_dir / file_name

                  print("Downloading...")


                  request = drive.files().get_media(
                      fileId=file_id
                  )


                  with open(
                      local_file,
                      "wb"
                  ) as output:

                      downloader = MediaIoBaseDownload(
                          output,
                          request,
                          chunksize=8 * 1024 * 1024
                      )

                      done = False

                      while not done:

                          status, done = downloader.next_chunk()

                          if status:

                              progress = int(
                                  status.progress() * 100
                              )

                              print(
                                  f"Download: {progress} %"
                              )


                  print("Running FFprobe...")


                  try:

                      probe = run_ffprobe(
                          local_file
                      )

                  except Exception as error:

                      print(
                          "FFprobe ERROR:",
                          error
                      )

                      continue


                  streams = probe.get(
                      "streams",
                      []
                  )

                  format_info = probe.get(
                      "format",
                      {}
                  )


                  # ----------------------------------------------
                  # VIDEO
                  # ----------------------------------------------

                  video = scan_video(
                      streams
                  )


                  # ----------------------------------------------
                  # AUDIO
                  # ----------------------------------------------

                  audio, hi_res_metadata = scan_audio(
                      streams
                  )


                  # ----------------------------------------------
                  # SUBTITLES
                  # ----------------------------------------------

                  subtitles = scan_subtitles(
                      streams
                  )


                  # ----------------------------------------------
                  # WARNINGS
                  # ----------------------------------------------

                  warnings = []


                  if not hi_res_metadata["artist"]:

                      warnings.append(
                          "Artist metadata missing from Hi-Res audio track"
                      )


                  if not audio["tracks"]:

                      warnings.append(
                          "No audio tracks found"
                      )


                  if len(audio["tracks"]) < 2:

                      warnings.append(
                          "Multi Audio not detected"
                      )


                  if video is None and get_extension(
                      file_name
                  ) in {
                      "mkv",
                      "mp4",
                      "webm",
                      "avi",
                      "mov",
                      "m4v"
                  }:

                      warnings.append(
                          "Video stream not found"
                      )


                  metadata_status = (
                      "OK"
                      if not warnings
                      else "INCOMPLETE"
                  )


                  # ----------------------------------------------
                  # FINAL RECORD
                  # ----------------------------------------------

                  record = {

                      "id": file_id,

                      "fileName": file_name,

                      "title": clean_title(
                          file_name
                      ),

                      # Artist ONLY from Hi-Res track
                      "artist": hi_res_metadata[
                          "artist"
                      ],

                      "album": hi_res_metadata[
                          "album"
                      ],

                      "composer": hi_res_metadata[
                          "composer"
                      ],

                      "year": "",

                      "genre": "",

                      "container": get_extension(
                          file_name
                      ),

                      "mimeType": file.get(
                          "mimeType",
                          ""
                      ),

                      "size": safe_int(
                          file.get(
                              "size",
                              0
                          )
                      ),

                      "created": file.get(
                          "createdTime",
                          ""
                      ),

                      "updated": file.get(
                          "modifiedTime",
                          ""
                      ),

                      "driveUrl": (
                          file.get(
                              "webViewLink",
                              ""
                          )
                          or
                          f"https://drive.google.com/file/d/{file_id}/view"
                      ),

                      "duration": format_info.get(
                          "duration",
                          ""
                      ),

                      "format": format_info.get(
                          "format_name",
                          ""
                      ),

                      "formatLong": format_info.get(
                          "format_long_name",
                          ""
                      ),

                      "video": video,

                      "audio": audio,

                      "subtitles": subtitles,

                      "hiResMetadata": hi_res_metadata,

                      "metadataStatus": metadata_status,

                      "warnings": warnings
                  }


                  catalog_files.append(
                      record
                  )


          # ============================================================
          # SORT
          # ============================================================

          catalog_files.sort(
              key=lambda item: item.get(
                  "title",
                  ""
              ).lower()
          )


          # ============================================================
          # CREATE MEDIA.JSON
          # ============================================================

          catalog = {

              "project": "Music Vault",

              "version": "5.0",

              "generatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "totalFiles": len(
                  catalog_files
              ),

              "files": catalog_files
          }


          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as output:

              json.dump(
                  catalog,
                  output,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("========================================")
          print(" SCAN COMPLETE")
          print("========================================")
          print(
              "Total Media:",
              len(catalog_files)
          )
          print(
              "Output:",
              OUTPUT_FILE
          )
          print("========================================")

          PY

      # ==========================================
      # 6. Run Scanner
      # ==========================================
      - name: Scan Music Vault
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scanner.py

      # ==========================================
      # 7. Update media.json in GitHub
      # ==========================================
      - name: Update media.json
        run: |
          git config user.name "Music Vault Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add media.json

          if git diff --cached --quiet; then
            echo "No metadata changes detected."
          else
            git commit -m "Auto-update Music Vault metadata"
            git push
          fi

      # ==========================================
      # 8. Complete
      # ==========================================
      - name: Complete job
        run: |
          echo "========================================"
          echo " MUSIC VAULT AUTOMATION COMPLETE"
          echo "========================================"
