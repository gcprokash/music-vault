name: Music Vault Drive Test

on:
  workflow_dispatch:

jobs:
  test-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Test Google Drive Access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os
          import json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          print("========================================")
          print(" MUSIC VAULT — GOOGLE DRIVE TEST")
          print("========================================")

          data = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])

          credentials = service_account.Credentials.from_service_account_info(
              data,
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )

          service = build("drive", "v3", credentials=credentials)

          results = service.files().list(
              q="name = 'Music Vault' and mimeType = 'application/vnd.google-apps.folder' and trashed = false",
              spaces="drive",
              fields="files(id,name)"
          ).execute()

          folders = results.get("files", [])

          if not folders:
              print("ERROR: Music Vault folder পাওয়া যায়নি।")
              raise SystemExit(1)

          folder = folders[0]

          print("SUCCESS!")
          print("Folder Name:", folder["name"])
          print("Folder ID:", folder["id"])

          files = service.files().list(
              q=f"'{folder['id']}' in parents and trashed = false",
              spaces="drive",
              fields="files(id,name,size,mimeType)"
          ).execute().get("files", [])

          print("")
          print("Files inside Music Vault:")

          for f in files:
              print("-", f["name"])

          print("")
          print("========================================")
          print(" GOOGLE DRIVE CONNECTION OK")
          print("========================================")
          PY
