<svg xmlns="http://www.w3.org/2000/svg"
width="1200" height="1200" viewBox="0 0 1200 1200">

  <defs>

    <linearGradient
        id="bg"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

      <stop
          offset="0%"
          stop-color="#12072b"/>

      <stop
          offset="48%"
          stop-color="#30206f"/>

      <stop
          offset="100%"
          stop-color="#6d28d9"/>

    </linearGradient>


    <radialGradient
        id="glow"
        cx="50%"
        cy="35%"
        r="65%">

      <stop
          offset="0%"
          stop-color="#a78bfa"
          stop-opacity="0.55"/>

      <stop
          offset="100%"
          stop-color="#7c3aed"
          stop-opacity="0"/>

    </radialGradient>


    <filter id="blur">

      <feGaussianBlur
          stdDeviation="55"/>

    </filter>

  </defs>


  <rect
      width="1200"
      height="1200"
      fill="url(#bg)"/>


  <circle
      cx="600"
      cy="340"
      r="360"
      fill="url(#glow)"
      filter="url(#blur)"/>


  <circle
      cx="600"
      cy="355"
      r="190"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.16"
      stroke-width="3"/>


  <circle
      cx="600"
      cy="355"
      r="125"
      fill="#ffffff"
      fill-opacity="0.08"/>


  <text
      x="600"
      y="90"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="28"
      letter-spacing="7"
      fill="#ffffff"
      fill-opacity="0.82">

    MUSIC VAULT

  </text>


  <text
      x="600"
      y="690"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="48"
      font-weight="700"
      fill="#ffffff">

    Ehsaas

  </text>


  <text
      x="600"
      y="750"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="28"
      fill="#ffffff"
      fill-opacity="0.78">

    GCP

  </text>


  <text
      x="600"
      y="805"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      fill="#ffffff"
      fill-opacity="0.58">

    Original Collection

  </text>


  <line
      x1="360"
      y1="875"
      x2="840"
      y2="875"
      stroke="#ffffff"
      stroke-opacity="0.20"/>


  <text
      x="600"
      y="945"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20"
      letter-spacing="5"
      fill="#ffffff"
      fill-opacity="0.55">

    GCP COLLECTION

  </text>

</svg>