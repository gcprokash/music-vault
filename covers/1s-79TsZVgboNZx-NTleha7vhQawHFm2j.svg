<svg
xmlns="http://www.w3.org/2000/svg"
width="1000"
height="1000"
viewBox="0 0 1000 1000">

<defs>

    <!-- Premium Background -->

    <linearGradient
        id="bg"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop
            offset="0%"
            stop-color="#12082d"/>

        <stop
            offset="45%"
            stop-color="#4c1d95"/>

        <stop
            offset="100%"
            stop-color="#160b35"/>

    </linearGradient>


    <!-- Main Glow -->

    <radialGradient
        id="glow">

        <stop
            offset="0%"
            stop-color="#a855f7"
            stop-opacity="0.95"/>

        <stop
            offset="45%"
            stop-color="#7c3aed"
            stop-opacity="0.45"/>

        <stop
            offset="100%"
            stop-color="#7c3aed"
            stop-opacity="0"/>

    </radialGradient>


    <!-- Secondary Glow -->

    <radialGradient
        id="glow2">

        <stop
            offset="0%"
            stop-color="#6366f1"
            stop-opacity="0.65"/>

        <stop
            offset="100%"
            stop-color="#6366f1"
            stop-opacity="0"/>

    </radialGradient>


    <!-- Glass Ring -->

    <linearGradient
        id="ring"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop
            offset="0%"
            stop-color="#ffffff"
            stop-opacity="0.30"/>

        <stop
            offset="100%"
            stop-color="#ffffff"
            stop-opacity="0.05"/>

    </linearGradient>

</defs>


<!-- =========================================
     BACKGROUND
     ========================================= -->

<rect
    width="1000"
    height="1000"
    fill="url(#bg)"/>


<!-- =========================================
     DECORATIVE GLOWS
     ========================================= -->

<circle
    cx="210"
    cy="170"
    r="280"
    fill="url(#glow2)"/>


<circle
    cx="790"
    cy="760"
    r="330"
    fill="url(#glow)"/>


<circle
    cx="500"
    cy="380"
    r="360"
    fill="url(#glow)"/>


<!-- =========================================
     OUTER RINGS
     ========================================= -->

<circle
    cx="500"
    cy="380"
    r="220"
    fill="none"
    stroke="url(#ring)"
    stroke-width="3"/>


<circle
    cx="500"
    cy="380"
    r="170"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.14"
    stroke-width="2"/>


<circle
    cx="500"
    cy="380"
    r="125"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.18"
    stroke-width="2"/>


<!-- =========================================
     CENTER DISC
     ========================================= -->

<circle
    cx="500"
    cy="380"
    r="82"
    fill="#ffffff"
    fill-opacity="0.06"
    stroke="#ffffff"
    stroke-opacity="0.22"
    stroke-width="2"/>


<!-- =========================================
     MUSIC ICON
     ========================================= -->

<text
    x="500"
    y="415"
    text-anchor="middle"
    fill="#ffffff"
    font-size="105"
    font-family="Arial, sans-serif"
    font-weight="700">

    ♪

</text>


<!-- =========================================
     SMALL LABEL
     ========================================= -->

<text
    x="500"
    y="560"
    text-anchor="middle"
    fill="#ddd6fe"
    font-size="22"
    font-family="Arial, sans-serif"
    font-weight="600"
    letter-spacing="7">

    MUSIC RELEASE

</text>


<!-- =========================================
     SONG TITLE
     ========================================= -->


<text
    x="500"
    y="690"
    text-anchor="middle"
    fill="#ffffff"
    font-size="46"
    font-family="Arial, sans-serif"
    font-weight="700">

    Kaattuchembakam

</text>



<!-- =========================================
     ARTIST
     ========================================= -->

<text
    x="500"
    y="875"
    text-anchor="middle"
    fill="#ddd6fe"
    font-size="28"
    font-family="Arial, sans-serif">

    Music Vault

</text>


<!-- =========================================
     MUSIC VAULT BRAND
     ========================================= -->

<text
    x="500"
    y="935"
    text-anchor="middle"
    fill="#ffffff"
    fill-opacity="0.42"
    font-size="20"
    font-family="Arial, sans-serif"
    font-weight="600"
    letter-spacing="6">

    MUSIC VAULT

</text>


</svg>