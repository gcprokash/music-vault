<!-- =====================================================
     MEDIA PLAYER
     ===================================================== -->

<section class="media-player-section" id="player">

  <div class="media-player">

    <!-- =================================================
         PLAYER TRACK
         ================================================= -->

    <div class="player-track">

      <div class="player-cover">
        MV
      </div>


      <div class="player-track-info">

        <span class="player-label">
          NOW PLAYING
        </span>

        <h3 id="player-title">
          No Track Selected
        </h3>

        <p id="player-subtitle">
          Select a song from your library
        </p>

      </div>

    </div>


    <!-- =================================================
         PLAYER CONTROLS
         ================================================= -->

    <div class="player-controls">

      <button
        class="player-control player-prev"
        type="button"
        aria-label="Previous">
        ⏮
      </button>


      <button
        class="player-control player-play"
        id="player-play"
        type="button"
        aria-label="Play">
        ▶
      </button>


      <button
        class="player-control player-next"
        type="button"
        aria-label="Next">
        ⏭
      </button>

    </div>


    <!-- =================================================
         PLAYER PROGRESS
         ================================================= -->

    <div class="player-progress">

      <span id="player-current-time">
        0:00
      </span>


      <input
        id="player-progress-bar"
        type="range"
        min="0"
        max="100"
        value="0">


      <span id="player-duration">
        0:00
      </span>

    </div>


    <!-- =================================================
         PLAYER VOLUME
         ================================================= -->

    <div class="player-volume">

      <span>
        🔊
      </span>


      <input
        id="player-volume-bar"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="1">

    </div>


    <!-- =================================================
         DOWNLOAD VIDEO
         ================================================= -->

    <div class="player-download">

      <a
        id="player-download"
        class="player-download-button"
        href="#"
        target="_blank"
        rel="noopener">
        ⬇ Download Video
      </a>

    </div>

  </div>

</section>
